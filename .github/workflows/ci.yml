name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: "Build (${{ matrix.arch }})"
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build static binary
        run: nix build .#packages.${{ matrix.arch }}.gxlimg-static -L

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: gxlimg-${{ matrix.arch }}
          path: result/bin/gxlimg
          overwrite: true

  snapshot:
    name: Update develop snapshot
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mv artifacts/gxlimg-x86_64-linux/gxlimg gxlimg-x86_64-linux
          mv artifacts/gxlimg-aarch64-linux/gxlimg gxlimg-aarch64-linux
          chmod +x gxlimg-*-linux

      - name: Delete old snapshot release
        run: gh release delete develop-latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create develop snapshot
        uses: softprops/action-gh-release@v2
        with:
          tag_name: develop-latest
          target_commitish: ${{ github.sha }}
          name: "develop snapshot (${{ github.sha }})"
          body: "Built from develop @ ${{ github.sha }}"
          prerelease: true
          make_latest: false
          files: |
            gxlimg-x86_64-linux
            gxlimg-aarch64-linux

  compare-tests:
    name: "Test: ${{ matrix.board }}"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        board:
          - compare-g12a-odroid-c4
          - compare-g12a-vim3l
          - compare-g12a-bananapi-m5
          - compare-g12b-odroid-n2
          - compare-g12b-radxa-zero2
          - compare-g12b-khadas-vim3
          - compare-axg-jethub-j100
          - compare-gxl-lepotato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            sandbox = relaxed

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: "Run comparison test: ${{ matrix.board }}"
        run: nix build .#checks.x86_64-linux.${{ matrix.board }} -L

      - name: Show test report
        if: always()
        run: |
          out=$(nix build .#checks.x86_64-linux.${{ matrix.board }} --print-out-paths 2>/dev/null || true)
          if [ -n "$out" ] && [ -f "$out/report.txt" ]; then
            cat "$out/report.txt"
          else
            echo "No report available (test may have failed to build)"
          fi
